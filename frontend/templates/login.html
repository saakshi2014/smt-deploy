<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Sales & Marketing Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1F4E79 0%, #2E75B6 100%);
            min-height: 100vh;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand-icon { font-size: 3rem; color: #1F4E79; }
        .btn-login  { background: #1F4E79; border: none; padding: 12px; font-size: 1rem; }
        .btn-login:hover { background: #2E75B6; }
        .spinner-border { width: 1.2rem; height: 1.2rem; }
    </style>
</head>
<body>

<div class="d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card login-card" style="width:420px;">
        <div class="card-body p-5">

            <div class="text-center mb-4">
                <i class="bi bi-bar-chart-line-fill brand-icon"></i>
                <h4 class="mt-3 fw-bold text-dark">Sales & Marketing Tracker</h4>
                <p class="text-muted small mb-0">Sign in to your account</p>
            </div>

            <div id="errorAlert" class="alert alert-danger d-none align-items-center">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorMessage">Invalid email or password.</span>
            </div>

            <div id="successAlert" class="alert alert-success d-none align-items-center">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span>Login successful! Redirecting...</span>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-dark">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" id="emailInput" class="form-control"
                           placeholder="you@example.com" autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-dark">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password" id="passwordInput" class="form-control"
                           placeholder="Enter your password" autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid">
                <button id="loginBtn" class="btn btn-login btn-primary text-white fw-semibold">
                    <span id="btnText">Sign In</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2">
                    </span>
                </button>
            </div>

            <div class="text-center mt-3">
                <a href="#" id="forgotPassword" class="text-muted small">Forgot password?</a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<script type="module">
import { initializeApp }                     from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword,
         sendPasswordResetEmail }            from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

// ── REPLACE THESE TWO VALUES WITH YOURS FROM .env ─────────────────────────────
const firebaseConfig = {
    apiKey:            "AIzaSyBAgcnI-jdxUz0aOxcUtmdfhXyZeN6Xe_w",
    authDomain:        "sales-marketing-tracker.firebaseapp.com",
    projectId:         "sales-marketing-tracker",
    storageBucket:     "sales-marketing-tracker.appspot.com",
    messagingSenderId: "779590223994",
    appId:             "1:779590223994:web:92659f2d595b11ea9e13c3"
};
// ──────────────────────────────────────────────────────────────────────────────

const firebaseApp = initializeApp(firebaseConfig);
const auth        = getAuth(firebaseApp);

const loginBtn      = document.getElementById('loginBtn');
const btnText       = document.getElementById('btnText');
const btnSpinner    = document.getElementById('btnSpinner');
const errorAlert    = document.getElementById('errorAlert');
const errorMessage  = document.getElementById('errorMessage');
const successAlert  = document.getElementById('successAlert');
const emailInput    = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const togglePwd     = document.getElementById('togglePassword');
const eyeIcon       = document.getElementById('eyeIcon');
const forgotPwd     = document.getElementById('forgotPassword');

togglePwd.addEventListener('click', () => {
    const isPassword   = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.className  = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
});

function showError(message) {
    errorMessage.textContent = message;
    errorAlert.classList.remove('d-none');
    errorAlert.classList.add('d-flex');
    successAlert.classList.add('d-none');
}

function setLoading(loading) {
    loginBtn.disabled   = loading;
    btnText.textContent = loading ? 'Signing in...' : 'Sign In';
    btnSpinner.classList.toggle('d-none', !loading);
}

function getErrorMessage(errorCode) {
    const messages = {
        'auth/invalid-email':          'Please enter a valid email address.',
        'auth/user-not-found':         'No account found with this email.',
        'auth/wrong-password':         'Incorrect password. Please try again.',
        'auth/invalid-credential':     'Invalid email or password. Please try again.',
        'auth/too-many-requests':      'Too many failed attempts. Try again later.',
        'auth/network-request-failed': 'Network error. Check your internet connection.'
    };
    return messages[errorCode] || 'Login failed. Please try again.';
}

async function handleLogin() {
    errorAlert.classList.add('d-none');
    successAlert.classList.add('d-none');

    const email    = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showError('Please enter both email and password.');
        return;
    }

    setLoading(true);

    try {
        // Step 1 — Firebase signs the user in
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user           = userCredential.user;

        // Step 2 — Get Firebase ID token
        const token = await user.getIdToken();

        // Step 3 — Send token to Python backend
        const response = await fetch('/api/auth/verify', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ token: token })
        });

        const data = await response.json();

        if (!response.ok) {
            showError(data.error || 'Authentication failed. Contact admin.');
            setLoading(false);
            return;
        }

        // Step 4 — Show success
        successAlert.classList.remove('d-none');
        errorAlert.classList.add('d-none');

        // Step 5 — Redirect based on role
        setTimeout(() => {
            if (data.role === 'employee') {
                window.location.href = '/dashboard/employee';
            } else if (data.role === 'm1_manager') {
                window.location.href = '/dashboard/m1';
            } else if (data.role === 'm2_manager') {
                window.location.href = '/dashboard/m2';
            } else {
                showError('Unknown role. Contact admin.');
                setLoading(false);
            }
        }, 800);

    } catch (error) {
        showError(getErrorMessage(error.code));
        setLoading(false);
    }
}

loginBtn.addEventListener('click', handleLogin);
passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
emailInput.addEventListener('keypress',    (e) => { if (e.key === 'Enter') handleLogin(); });

forgotPwd.addEventListener('click', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    if (!email) {
        showError('Enter your email address first, then click Forgot Password.');
        return;
    }
    try {
        await sendPasswordResetEmail(auth, email);
        successAlert.querySelector('span').textContent =
            'Password reset email sent! Check your inbox.';
        successAlert.classList.remove('d-none');
        errorAlert.classList.add('d-none');
    } catch (error) {
        showError(getErrorMessage(error.code));
    }
});
</script>

</body>
</html>
